<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Forgot Password — Koya Talent</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="page-center">
    <div class="card">
      <div class="card-header">
        <span class="wordmark">Koya Talent</span>
      </div>
      <div class="card-body">
        <h1>Forgot Password</h1>
        <p class="list-item-meta" style="margin: -12px 0 16px 0;">Enter your email and we'll send you a reset code.</p>
        <form method="post" action="/forgot-password" id="forgot-form">
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" value="{{ email }}" required>
          </div>
          <button type="submit" class="btn btn-block" data-loading-text="Sending…">
            <span class="spinner" hidden></span>
            <span data-btn-text>Send Reset Code</span>
          </button>
        </form>
        <p style="margin-top: 20px;"><a href="/login">Back to login</a></p>
      </div>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
