<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>All Proposals — Koya Talent</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  {% include "_navbar.html" %}

  <div class="page">
    <div class="page-header">
      <h1>All Proposals</h1>
    </div>

    {% if error %}
    <p class="error-message">{{ error }}</p>
    {% endif %}

    <form method="get" action="/admin/proposals" class="filter-bar"
          hx-get="/admin/proposals" hx-target="#admin-proposals-results" hx-swap="outerHTML" hx-push-url="true"
          hx-trigger="submit, change">
      <input type="text" name="client" value="{{ filters.client }}" placeholder="Search by client or company"
             aria-label="Client / Company" class="filter-search">
      <select name="status" aria-label="Status">
        <option value="">Any status</option>
        {% for s in statuses %}
        <option value="{{ s }}" {% if filters.status == s %}selected{% endif %}>{{ s.replace('_', ' ')|title }}</option>
        {% endfor %}
      </select>
      <select name="salesperson_id" aria-label="Salesperson">
        <option value="">Any salesperson</option>
        {% for u in salespeople %}
        <option value="{{ u.id }}" {% if filters.salesperson_id == u.id|string %}selected{% endif %}>{{ u.name }}</option>
        {% endfor %}
      </select>
      <select name="approver_id" aria-label="Approver">
        <option value="">Any approver</option>
        {% for u in approvers %}
        <option value="{{ u.id }}" {% if filters.approver_id == u.id|string %}selected{% endif %}>{{ u.name }}</option>
        {% endfor %}
      </select>
      <div class="filter-date-range">
        <input type="date" name="date_from" value="{{ filters.date_from }}" aria-label="From date">
        <span class="gate-note">&ndash;</span>
        <input type="date" name="date_to" value="{{ filters.date_to }}" aria-label="To date">
      </div>
      <button type="submit" class="btn btn-sm">Search</button>
      <!-- Always rendered, not conditional on the server-known filter state:
           only the results div (#admin-proposals-results) gets swapped by
           htmx on a filter change, so a condition here would get stuck at
           whatever filters were active on the last full page load. Harmless
           to show when nothing's actually filtered - it's just a no-op. -->
      <a href="/admin/proposals" class="btn btn-sm btn-secondary">Clear</a>
    </form>

    {% include "_admin_proposals_results.html" %}
  </div>

  <script src="/static/htmx.min.js"></script>
</body>
</html>
