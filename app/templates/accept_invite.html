<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Set Your Password — Koya Talent</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="page-center">
    <div class="card">
      <div class="card-header">
        <span class="wordmark">Koya Talent</span>
      </div>
      <div class="card-body">
        <h1>Set Your Password</h1>
        <p class="list-item-meta" style="margin: -12px 0 16px 0;">Setting up the account for <strong>{{ email }}</strong></p>
        {% if error %}
        <p class="error-message">{{ error }}</p>
        {% endif %}
        <form method="post" action="/accept-invite/{{ token }}" id="invite-form">
          <div class="field">
            <label for="password">Password</label>
            <div class="password-wrapper">
              <input type="password" id="password" name="password" required minlength="8">
              <button type="button" class="password-toggle" data-target="password" aria-label="Show password">
                <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="icon-eye-off" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
          </div>
          <div class="field">
            <label for="confirm_password">Confirm Password</label>
            <div class="password-wrapper">
              <input type="password" id="confirm_password" name="confirm_password" required minlength="8">
              <button type="button" class="password-toggle" data-target="confirm_password" aria-label="Show password">
                <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="icon-eye-off" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
          </div>
          <button type="submit" class="btn btn-block" id="submit-btn" data-loading-text="Setting up…">
            <span class="spinner" hidden></span>
            <span data-btn-text>Set Password &amp; Sign In</span>
          </button>
        </form>
      </div>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
