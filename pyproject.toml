[project]
name = "ai-proposal-application"
version = "0.1.0"
description = "AI-powered proposal application for Koya Talent"
authors = [
    {name = "Koya Talent"}
]
readme = "README.md"
requires-python = "^3.11"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.52.4,<0.53.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "psycopg[binary] (>=3.3.5,<4.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "anthropic (>=1.4.0,<2.0.0)",
    "alembic (>=1.19.2,<2.0.0)",
    "passlib (>=1.7.4,<2.0.0)",
    "itsdangerous (>=2.2.0,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "playwright (>=1.62.0,<2.0.0)",
    "markdown (>=3.10.3,<4.0.0)",
    "slowapi (>=0.1.10,<0.2.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
